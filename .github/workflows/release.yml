name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  release-macos:
    name: Build & Publish macOS Release
    runs-on: macos-14
    if: startsWith(github.ref, 'refs/tags/v') && github.event_name == 'push'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Build macOS app bundle and t3d binary
        run: ./scripts/build-macos-app.sh

      - name: Package release artifacts and checksums
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          rm -rf release
          mkdir -p release

          app_zip="T3-Code-RS-${RELEASE_TAG}-macos-arm64.app.zip"
          t3d_bin="t3d-${RELEASE_TAG}-macos-arm64"

          ditto -c -k --sequesterRsrc --keepParent "dist/T3 Code RS.app" "release/${app_zip}"
          cp "dist/T3 Code RS.app/Contents/MacOS/t3d" "release/${t3d_bin}"
          chmod +x "release/${t3d_bin}"

          (
            cd release
            if command -v sha256sum >/dev/null 2>&1; then
              sha256sum "${app_zip}" "${t3d_bin}" > SHA256SUMS.txt
            else
              shasum -a 256 "${app_zip}" "${t3d_bin}" > SHA256SUMS.txt
            fi
          )

          ls -lh release
          cat release/SHA256SUMS.txt

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            gh release upload "${RELEASE_TAG}" release/* --clobber
          else
            gh release create "${RELEASE_TAG}" release/* \
              --title "${RELEASE_TAG}" \
              --generate-notes
          fi
